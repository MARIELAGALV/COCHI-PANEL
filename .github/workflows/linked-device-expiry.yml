name: CO-CHI expiración y vínculo de dispositivos
on:
  push:
    branches:
      - fix/linked-device-service-expiry
  pull_request:
    branches: [main]
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate backend syntax
        run: node --check server.js
      - name: Run Android-device and expiry regression tests
        run: npm test
