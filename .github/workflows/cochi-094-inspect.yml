name: COCHI 094 inspect
on:
  push:
    branches: [cochi-094-audio-test-build]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download and decode
        run: |
          set -eux
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar -O apktool.jar
          wget -q https://github.com/MARIELAGALV/CO-CHIUPDATES/releases/download/v0.23.93/CO-CHI.apk -O cochi93.apk
          java -jar apktool.jar d -f -r cochi93.apk -o decoded
      - name: Inspect renderers factory and player construction
        run: |
          set -e
          echo "=== x/I2 header + constructors ==="
          sed -n '1,520p' decoded/smali/x/I2.smali
          echo "=== x/I2 extension area ==="
          sed -n '3000,3520p' decoded/smali/x/I2.smali
          echo "=== PlayerActivity construction A ==="
          sed -n '3920,4100p' decoded/smali/com/cochi/client/PlayerActivity.smali
          echo "=== PlayerActivity construction B ==="
          sed -n '5560,5820p' decoded/smali/com/cochi/client/PlayerActivity.smali
          echo "=== PlayerActivity construction C ==="
          sed -n '11680,11820p' decoded/smali/com/cochi/client/PlayerActivity.smali
