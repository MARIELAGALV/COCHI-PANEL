name: COCHI 094 inspect
on:
  push:
    branches: [cochi-094-audio-test-build]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cochi-094-audio-test-build
      - name: Decompile stable 93
        run: |
          set -eux
          rm -rf work
          mkdir -p work
          wget -q https://github.com/skylot/jadx/releases/download/v1.5.2/jadx-1.5.2.zip -O work/jadx.zip
          unzip -q work/jadx.zip -d work/jadx
          chmod +x work/jadx/bin/jadx
          wget -q https://github.com/MARIELAGALV/CO-CHIUPDATES/releases/download/v0.23.93/CO-CHI.apk -O work/cochi93.apk
          work/jadx/bin/jadx --show-bad-code -d work/jadx-out work/cochi93.apk || true
      - name: Extract seek/retry behavior
        run: |
          set -eux
          mkdir -p tools/cochi94/stable93-extra
          {
            echo "=== seek and retry matches ==="
            grep -RInE -C 30 'Reconexion silenciosa|PLAYBACK_ERROR|Reintento de reproducción|reintento|reconex|currentPosition|getCurrentPosition|seekToDefaultPosition|seekTo\(' work/jadx-out/sources 2>/dev/null | head -12000 || true
            echo "=== 5min matches ==="
            grep -RInE -C 12 '300000|5 min|15 min' work/jadx-out/sources/com/cochi/client work/jadx-out/sources/x 2>/dev/null | head -4000 || true
          } > tools/cochi94/stable93-extra/seek-report.txt
      - name: Commit
        run: |
          set -eux
          git config user.name "cochi-build-bot"
          git config user.email "cochi-build-bot@users.noreply.github.com"
          git add tools/cochi94/stable93-extra/seek-report.txt
          git diff --cached --quiet && exit 0
          git commit -m "Inspeccionar corrección de seek de 0.23.93"
          git pull --rebase origin cochi-094-audio-test-build
          git push origin HEAD:cochi-094-audio-test-build
