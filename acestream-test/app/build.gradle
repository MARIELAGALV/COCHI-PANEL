plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cochi.acestreamtest'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cochi.acestreamtest'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '0.3.0-ACE-TEST-V3'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
